[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solitario-spider"
version = "0.1.0"
description = "Solitario Spider para computador, com interface personalizavel."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
